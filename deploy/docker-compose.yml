# Production stack — fully isolated from the dev compose project.
#
# Run through `just deploy` / `just deploy-*` (they pass --env-file deploy/.env).
# The backend image is built by scripts/deploy.sh from a pristine snapshot of
# the main branch; this file only runs it. Secrets live in deploy/.env and are
# injected at runtime — never baked into the image.

name: garbanzo-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: garbanzo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: garbanzo_ai_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garbanzo -d garbanzo_ai_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port: reachable only inside the prod network.

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      # Models + the `ollama signin` identity key (cloud models need a one-time
      # signin — see deploy/README.md). Survives redeploys.
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No host port: reachable only inside the prod network.

  read-aloud:
    image: garbanzo-read-aloud:latest
    restart: unless-stopped
    init: true
    mem_limit: 6g
    environment:
      READ_ALOUD_WORKER_TOKEN: ${READ_ALOUD_WORKER_TOKEN:?Set READ_ALOUD_WORKER_TOKEN in deploy/.env}
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in deploy/.env for gated Pocket assets}
      HF_HOME: /models/huggingface
      POCKET_TTS_CACHE_DIR: /models/pocket-tts
      HF_HUB_DISABLE_XET: "1"
      OMP_NUM_THREADS: "4"
    volumes:
      - read_aloud_hf_cache:/models/huggingface
      - read_aloud_pocket_cache:/models/pocket-tts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8021/health/ready', timeout=5)); assert r['status']=='ready'",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    # Internal-only service. Audio reaches clients through the authenticated backend.

  backend:
    image: garbanzo-backend:latest
    restart: unless-stopped
    init: true # reap zombies from micro-apps dev-server/opencode subprocesses
    environment:
      # ---- prod invariants (not overridable from deploy/.env) ----
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://garbanzo:${POSTGRES_PASSWORD}@postgres:5432/garbanzo_ai_prod
      OLLAMA_BASE_URL: http://ollama:11434
      STT_MODE: local
      STT_DEVICE: ${STT_DEVICE:-cpu}
      TTS_DEVICE: ${TTS_DEVICE:-cpu}
      READ_ALOUD_WORKER_URL: http://read-aloud:8021
      READ_ALOUD_WORKER_TOKEN: ${READ_ALOUD_WORKER_TOKEN:?Set READ_ALOUD_WORKER_TOKEN in deploy/.env}
      READ_ALOUD_CACHE_DIR: ${READ_ALOUD_CACHE_DIR:-/tmp/garbanzo-read-aloud}
      TEST_USER_EMAIL: ""
      TEST_USER_PASSWORD: ""
      CORS_ORIGINS: ${PROD_CORS_ORIGINS:?Run through the production just recipes}
      # Micro-apps: repo cloned into the volume below, synced periodically,
      # served through the backend's authenticated /micro-apps proxy.
      MICROAPPS_REPO_PATH: /data/micro-apps
      MICROAPPS_PROXY_MODE: "true"
      # Git identity + SSH key for micro-apps publish (same GitHub user as the host).
      GIT_SSH_COMMAND: ssh -i /root/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
      GIT_AUTHOR_NAME: ${GIT_USER_NAME}
      GIT_AUTHOR_EMAIL: ${GIT_USER_EMAIL}
      GIT_COMMITTER_NAME: ${GIT_USER_NAME}
      GIT_COMMITTER_EMAIL: ${GIT_USER_EMAIL}
      # ---- user-provided (deploy/.env) ----
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Ollama hosted web_search/web_fetch API key (websearch MCP stdio server).
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-deepseek-v4.1-flash:cloud}
      MEMORY_EXTRACTION_MODEL: ${MEMORY_EXTRACTION_MODEL:-deepseek-v4.1-flash:cloud}
      SCHEDULED_ACTION_MODEL: ${SCHEDULED_ACTION_MODEL:-deepseek-v4.1-flash:cloud}
      MICROAPPS_GIT_URL: ${MICROAPPS_GIT_URL:-}
      MICROAPPS_OPENCODE_MODEL: ${MICROAPPS_OPENCODE_MODEL:-ollama/deepseek-v4.1-flash:cloud}
      # Topic context: semantic curator (empty model = deterministic only).
      TOPIC_CURATOR_MODEL: ${TOPIC_CURATOR_MODEL:-}
      TOPIC_CONTEXT_PRIVACY_MODE: ${TOPIC_CONTEXT_PRIVACY_MODE:-local_only}
      # Repo whose GitHub Releases feed the desktop auto-updater.
      GITHUB_REPO: ${GITHUB_REPO:-JorgeGarciaIrazabal/garbanzo-ai}
      TZ: ${TZ:-UTC}
    volumes:
      # Kokoro TTS + Whisper STT models persist across deploys (~2 GB, one-time).
      - hf_cache:/root/.cache/huggingface
      # Micro-apps repo clone + per-user worktrees + node_modules.
      - microapps_repo:/data/micro-apps
      # Host credentials, mounted read-only. deploy.sh checks these exist.
      - ${GIT_SSH_KEY_PATH}:/root/.ssh/id_deploy:ro
      - ../backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "127.0.0.1:8001:8000" # local smoke tests only; public access is via the enabled tunnels
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      read-aloud:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  ngrok:
    profiles: [ngrok]
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["http", "--url=https://${NGROK_DOMAIN:-}", "--log=stdout", "backend:8000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      backend:
        condition: service_healthy

  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  hf_cache:
  microapps_repo:
  ollama_data:
  read_aloud_hf_cache:
  read_aloud_pocket_cache:
