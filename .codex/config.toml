# Canonical project Codex configuration. Model access is checked at setup.
model = "gpt-6-astra"
model_reasoning_effort = "medium"

[agents]
max_threads = 4

[mcp_servers.serena]
command = "just"
args = ["ai-serena"]
startup_timeout_sec = 180

[mcp_servers.qmd]
command = "just"
args = ["ai-qmd-mcp"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@2.1.4"]
enabled = false

[mcp_servers.dart-mcp-server]
command = "dart"
args = ["mcp-server"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]

[mcp_servers.marionette]
command = "bash"
args = ["scripts/marionette_mcp.sh"]

[mcp_servers.websearch]
command = "uv"
args = ["run", "backend/app/mcp_stdio_servers/web_search.py"]

[agents.backend_agent]
description = "Senior FastAPI backend engineer for Garbanzo AI."
config_file = "agents/backend-agent.toml"

[agents.frontend_agent]
description = "Senior Flutter frontend engineer for Garbanzo AI."
config_file = "agents/frontend-agent.toml"

[agents.infra_agent]
description = "DevOps and infrastructure engineer for Garbanzo AI."
config_file = "agents/infra-agent.toml"

[agents.test_agent]
description = "QA engineer for FastAPI and Flutter testing in Garbanzo AI."
config_file = "agents/test-agent.toml"
