[project]
name = "garbanzo-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Garbanzo AI Flutter app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
    "kokoro>=0.9.0",
    "av>=14.0.0",
    "soundfile>=0.13.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "apscheduler>=3.10.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
    "faster-whisper>=1.0.0",
    "mcp>=1.0",
    "firebase-admin>=6.5.0",
    "pgvector>=0.3.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
