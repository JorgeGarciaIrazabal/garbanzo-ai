[project]
name = "garbanzo-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Garbanzo AI Flutter app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
    "kokoro>=0.9.0",
    "av>=14.0.0",
    "soundfile>=0.13.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "apscheduler>=3.10.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
    # Converts DOCX/PPTX/HTML/images (and more) to markdown for the sandboxed
    # folder read_file tool; PDF/CSV/XLSX still go through pypdf/openpyxl above.
    "markitdown[docx,pptx,xlsx]>=0.1.0",
    # Downscaling image attachments before they reach the vision model
    "pillow>=10.0.0",
    "faster-whisper>=1.0.0",
    "mcp>=1.0",
    "firebase-admin>=6.5.0",
    "pgvector>=0.3.0",
    "tiktoken>=0.8.0",
    "websockets>=13.0",
    # Declared explicitly (kokoro pulls it anyway) so [tool.uv.sources] can pin
    # it to CPU wheels — see the pytorch-cpu index below.
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/tests/*", "tests/*"]
# Coverage loses tracking across `await` points that involve SQLAlchemy's
# internal greenlet context switches (async SQLAlchemy is built on greenlet).
# Without this flag, async endpoint/service function bodies are reported as
# missed even when executed — see coveragepy/coveragepy#1082. Files that
# don't go through async sqlalchemy (LLM providers, native tools, audio
# services) genuinely have the gaps shown; the flag just stops the
# systematic false-misses in DB-touching async code.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# torch is a transitive dep (kokoro). Pin it to CPU wheels: no machine in this
# project has an NVIDIA GPU, and the CUDA build adds ~10 GB to the Docker image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

# FastAPI's `Depends(...)` / `Query(...)` / etc. as argument defaults is the
# framework's intended, documented pattern (not the mutable-default-argument
# footgun B008 targets) — see astral-sh/ruff#4103 and FastAPI's own docs.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
