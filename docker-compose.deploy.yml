services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: garbanzo_ai_postgres_deploy
    restart: unless-stopped
    environment:
      POSTGRES_USER: garbanzo
      POSTGRES_PASSWORD: garbanzo_prod
      POSTGRES_DB: garbanzo_ai_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    # Internal only

  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: garbanzo_ai_whisper
    restart: unless-stopped
    environment:
      WHISPER__MODEL: Systran/faster-distil-whisper-large-v3
    volumes:
      - whisper_models:/root/.cache/huggingface
    # Internal only

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.deploy
    image: garbanzo-ai-backend:latest
    container_name: garbanzo_ai_backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://garbanzo:garbanzo_prod@postgres:5432/garbanzo_ai_prod
      FASTER_WHISPER_URL: http://faster-whisper:8000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - faster-whisper

volumes:
  postgres_prod_data:
  whisper_models:
