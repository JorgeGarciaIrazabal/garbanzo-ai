# Development services only. The production stack lives in deploy/ and is a
# separate compose project (garbanzo-prod) with its own database and volumes.
#
# The project name is pinned so existing dev volumes keep resolving.
name: garbanzo-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: garbanzo_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: garbanzo
      POSTGRES_PASSWORD: garbanzo_dev
      POSTGRES_DB: garbanzo_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Kept for STT_MODE=remote testing; the default (local) runs Whisper
  # in-process inside the backend.
  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: garbanzo_ai_whisper
    restart: unless-stopped
    environment:
      WHISPER__MODEL: Systran/faster-distil-whisper-large-v3
    ports:
      - "8010:8000"
    volumes:
      - whisper_models:/root/.cache/huggingface

volumes:
  postgres_data:
  whisper_models:
