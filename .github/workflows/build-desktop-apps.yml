name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  # Extract the API URL from the annotated tag message (set by scripts/deploy.sh).
  # The tag annotation contains a line "API_URL: https://<ngrok-domain>".
  prepare:
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.extract.outputs.api_url }}
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: extract
        run: |
          # Get the annotated tag message (not the lightweight tag).
          TAG_MSG=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          # Extract the API_URL line.
          API_URL=$(echo "$TAG_MSG" | grep -oP 'API_URL: \K.*' || true)
          if [ -z "$API_URL" ]; then
            echo "WARNING: No API_URL found in tag annotation — desktop apps will use debug defaults."
            API_URL=""
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "API_URL: $API_URL"
          echo "Version: ${GITHUB_REF_NAME#v}"

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            libcanberra-gtk3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux desktop
        run: |
          ARGS=""
          if [ -n "${{ needs.prepare.outputs.api_url }}" ]; then
            ARGS="--dart-define=API_BASE_URL=${{ needs.prepare.outputs.api_url }}"
          fi
          flutter build linux --release $ARGS

      - name: Archive Linux build
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$RUNNER_TEMP/garbanzo-ai-linux-${{ needs.prepare.outputs.version }}.tar.gz" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: garbanzo-ai-linux-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/garbanzo-ai-linux-${{ needs.prepare.outputs.version }}.tar.gz
          retention-days: 30

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows desktop
        run: |
          $args = @()
          $apiUrl = "${{ needs.prepare.outputs.api_url }}"
          if ($apiUrl -ne "") {
            $args += "--dart-define=API_BASE_URL=$apiUrl"
          }
          flutter build windows --release @args

      - name: Archive Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "$env:RUNNER_TEMP\garbanzo-ai-windows-${{ needs.prepare.outputs.version }}.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: garbanzo-ai-windows-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/garbanzo-ai-windows-${{ needs.prepare.outputs.version }}.zip
          retention-days: 30

  release:
    needs: [prepare, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip