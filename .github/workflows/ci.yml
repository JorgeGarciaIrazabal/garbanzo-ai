name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Codecov posts status checks via the Checks API using the CODECOV_TOKEN;
  # we don't grant write on statuses/PRs to the GITHUB_TOKEN.

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Tests run against an in-memory SQLite DB (see backend/tests/conftest.py)
        # and never touch Postgres. The service is kept only so Settings()
        # can be instantiated with a real-looking DATABASE_URL during import.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: garbanzo
          POSTGRES_PASSWORD: garbanzo_dev
          POSTGRES_DB: garbanzo_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tests use in-memory SQLite, but the app's module-level engine is built
      # from DATABASE_URL at import time before conftest swaps it out — keep a
      # valid URL so that lazy pool construction doesn't fail.
      DATABASE_URL: postgresql+asyncpg://garbanzo:garbanzo_dev@localhost:5432/garbanzo_ai
      SECRET_KEY: ci-test-secret-key-do-not-use-in-prod

    steps:
      - uses: actions/checkout@v7

      - name: Install uv + Python
        # setup-uv publishes only full-semver tags (no floating v8 major tag)
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install backend dependencies
        run: just be-install

      - name: Lint (ruff)
        run: just be-lint

      - name: Test (pytest with coverage)
        run: just be-test-cov

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true    # we pass the file explicitly; skip gcov/lcov scans
          fail_ci_if_error: false # keep uploads non-blocking; codecov.yml gates via status checks

  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # pubspec.yaml pins `sdk: ^3.11.0` (Dart) — current Flutter stable
      # ships a Dart SDK well above that, so the stable channel is used
      # as-is rather than pinning an exact Flutter version.
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install frontend dependencies
        run: just fe-install

      - name: Lint (flutter analyze)
        run: just fe-lint

      - name: Test (flutter test with coverage)
        run: just fe-test-cov

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false
